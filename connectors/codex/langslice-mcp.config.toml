# One-brain registration through the LangSlice MCP tools only, for
# `codex exec`. Copy to ~/.codex/langslice-mcp.config.toml and run with
# `codex exec -p langslice-mcp ...` (the file layers on the base user config).
sandbox_mode = "read-only"
approval_policy = "never"

[features]
shell_tool = false

[mcp_servers.langslice]
command = "langslice"
args = ["mcp"]
startup_timeout_sec = 60
tool_timeout_sec = 600
default_tools_approval_mode = "approve"
required = true
