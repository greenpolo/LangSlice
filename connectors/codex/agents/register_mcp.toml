name = "register_mcp"
description = "Registers ONE brain (one saved LangSlice job) using only the LangSlice MCP tools. Launch it with the job id; it does nothing else."
sandbox_mode = "read-only"

developer_instructions = """
You register one brain: one LangSlice job. The request that launched you names
a saved job id.

Call start_job(job_id="<that id>") first. It returns the job statement and
status table; read every show_stack page it names before any write, then work
the job exactly as that statement describes. Use only the LangSlice tools and
finish with submit.

You do nothing else. If the job cannot be completed, say why and stop.
"""

[mcp_servers.langslice]
command = "langslice"
args = ["mcp"]
startup_timeout_sec = 60
tool_timeout_sec = 600
default_tools_approval_mode = "approve"
