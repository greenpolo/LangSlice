# Default round hyperparameters for the Expert Iteration multi-round driver.
#
# This file documents canonical defaults; the iterate.py CLI does not yet
# auto-load TOML — pass overrides on the command line. Wave 2 supports
# --rounds N for chaining; setting --rounds 1 reproduces wave 1 behavior.

[round]
rollouts_per_prompt = 4
prompts_per_round = 800
concurrency = 4
filter_mode = "best-of-n"        # "threshold-accept" | "both"
threshold_pct_of_plane = 0.015   # = plane_tolerance_pct, matches distilled corpus
temperature = 0.9
max_iterations = 20
max_retries = 2
media_resolution = "medium"
apply_clahe = false
seed = 12345
max_fetch_calls = 2              # trace-trim cap on fetch_atlas turns kept
max_total_images = 12            # trace-trim cap on total tool_result images

[chain]
rounds = 3                       # default multi-round chain length
start_round = 0                  # resume entry point; 0 = fresh run

[vllm]
url = "http://127.0.0.1:8000/v1"
base_compose = "docker-compose.training.yml"
served_model_name = "langslice-ft"
max_model_len = 8192
gpu_memory_utilization = 0.85
startup_timeout_s = 300.0
manage = true                    # multi-round defaults to driver-managed lifecycle

[sft_retrain]
config = "models/langslice-gemma-4/training/configs/sft_default.toml"
skip = false                     # set true with --skip-retrain to debug filter changes

[eval]
bench = "tiny"                   # "tiny" | "small" | "large"
skip = false                     # set true with --skip-eval to skip slicebench step

[paths]
base_checkpoint = "out/sft/docker-sft-1011-merged-bf16"
base_corpus = "models/langslice-gemma-4/data/sft_examples.jsonl"
iterative_corpus_dir = "out/iterative_sft"
allocation_root = "data/manifest"
output_dir = "out/expert_iteration/run_001"

[planes]
include = ["coronal", "sagittal", "horizontal"]
