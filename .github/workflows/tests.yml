name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: ruff + basedpyright + import layers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install LangSlice + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,registration]"

      - name: ruff check
        run: python -m ruff check .

      - name: basedpyright
        run: python -m basedpyright

      - name: import layers (import-linter)
        run: lint-imports

  pytest:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python-version: "3.10"}
          - {os: ubuntu-latest, python-version: "3.11"}
          - {os: ubuntu-latest, python-version: "3.12"}
          - {os: windows-latest, python-version: "3.11"}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install LangSlice + dev and registration extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,registration]"

      # The default suite deselects tests marked slow.
      - name: Run pytest
        run: python -m pytest
