name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: ruff + basedpyright + import layers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install LangSlice + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff check
        run: python -m ruff check .

      - name: basedpyright
        run: python -m basedpyright

      - name: import layers (import-linter)
        run: lint-imports

  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install LangSlice + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The default suite (`slow` tests are deselected by pyproject). The
      # golden-snapshot test needs the optional ANTs engine (the `registration`
      # extra), which is not installed here, so it skips; run it locally.
      - name: Run pytest
        run: python -m pytest
