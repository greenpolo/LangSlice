name: Fiji connector

on:
  push:
    branches: [main]
    paths:
      - "fiji-plugin/**"
      - ".github/workflows/fiji-plugin.yml"
  pull_request:
    paths:
      - "fiji-plugin/**"
      - ".github/workflows/fiji-plugin.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
          cache-dependency-path: fiji-plugin/pom.xml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build connector with declared Maven dependencies
        working-directory: fiji-plugin
        run: mvn --batch-mode package dependency:build-classpath -Dmdep.outputFile=target/test-classpath.txt
      - name: Exercise worker protocol and SciJava command discovery
        working-directory: fiji-plugin
        # These are executable smoke checks, not JUnit tests; invoke their main
        # explicitly rather than assuming Surefire discovers them.
        run: |
          for smoke in ConnectorSmokeTest HostGeometrySmokeTest; do
            java -Djava.awt.headless=true \
              -Djava.util.prefs.userRoot="$RUNNER_TEMP/langslice-test-prefs" \
              -cp "target/test-classes:target/classes:$(cat target/test-classpath.txt)" \
              "org.langslice.fiji.$smoke"
          done
      - name: Upload connector JAR
        uses: actions/upload-artifact@v4
        with:
          name: langslice-fiji
          path: fiji-plugin/target/langslice-fiji-*.jar
