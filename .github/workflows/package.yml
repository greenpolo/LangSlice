name: Package

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Audit and install wheel
        shell: bash
        run: |
          python packaging/check_wheel.py dist/*.whl
          python -m pip install dist/*.whl
          python -m pip install uv
          # itk's Linux wheels ship a WHEEL file neither pip check nor uv can
          # read; any other finding fails the job
          if ! out=$(NO_COLOR=1 uv pip check --python "$(python -c 'import sys; print(sys.executable)')" 2>&1); then
            echo "$out"
            if echo "$out" | grep -v -e 'Found 1 incompatibilit' -e 'The package `itk` is broken' -e '^Checked [0-9]* packages' -e '^Using Python' | grep -q .; then
              exit 1
            fi
          fi
      - name: Run the installed command outside the checkout
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          langslice version
          langslice-job ops > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: langslice-wheel-${{ matrix.os }}
          path: dist/*.whl
