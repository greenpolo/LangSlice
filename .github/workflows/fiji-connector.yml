name: Fiji connector

on:
  push:
    branches: [main]
    paths:
      - "connectors/fiji/**"
      - ".github/workflows/fiji-connector.yml"
  pull_request:
    paths:
      - "connectors/fiji/**"
      - ".github/workflows/fiji-connector.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: connectors/fiji/pom.xml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build connector with declared Maven dependencies
        working-directory: connectors/fiji
        run: mvn --batch-mode package dependency:build-classpath '-Dmdep.outputFile=target/test-classpath.txt'
      - name: Exercise worker protocol and SciJava command discovery (Linux)
        if: runner.os != 'Windows'
        working-directory: connectors/fiji
        shell: bash
        run: |
          for smoke in ConnectorSmokeTest HostGeometrySmokeTest; do
            java -Djava.awt.headless=true \
              -Djava.util.prefs.userRoot="$RUNNER_TEMP/langslice-test-prefs" \
              -cp "target/test-classes:target/classes:$(cat target/test-classpath.txt)" \
              "org.langslice.fiji.$smoke"
          done
      - name: Exercise worker protocol and SciJava command discovery (Windows)
        if: runner.os == 'Windows'
        working-directory: connectors/fiji
        shell: pwsh
        run: |
          $classpath = (Get-Content target/test-classpath.txt -Raw).Trim()
          foreach ($smoke in @('ConnectorSmokeTest', 'HostGeometrySmokeTest')) {
            & java '-Djava.awt.headless=true' "-Djava.util.prefs.userRoot=$env:RUNNER_TEMP\langslice-test-prefs" -cp "target/test-classes;target/classes;$classpath" "org.langslice.fiji.$smoke"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Upload connector JAR
        uses: actions/upload-artifact@v4
        with:
          name: langslice-fiji
          path: connectors/fiji/target/langslice-fiji-*.jar
