          });
          $("rlvr-f-dataset").addEventListener("change", (e) => {
            rlvr.state.dataset = e.target.value;
            rlvr.state.offset = 0;
            rlvr.refresh();
          });
          $("rlvr-f-status").addEventListener("change", (e) => {
            rlvr.state.rlvr_status = e.target.value;
            rlvr.state.offset = 0;
            rlvr.refresh();
          });
          $("rlvr-f-limit").addEventListener("change", (e) => {
            rlvr.state.limit = parseInt(e.target.value, 10) || 48;
            rlvr.state.offset = 0;
            rlvr.refresh();
          });
          let qt = null;
          $("rlvr-f-q").addEventListener("input", (e) => {
            rlvr.state.q = e.target.value;
            if (qt) clearTimeout(qt);
            qt = setTimeout(() => { rlvr.state.offset = 0; rlvr.refresh(); }, 250);
          });
          $("rlvr-reset").addEventListener("click", () => {
            Object.assign(rlvr.state, {
              plane: "", dataset: "", atlas: "", rlvr_status: "",
              q: "", limit: 48, offset: 0, mode: rlvr.state.mode,
            });
            $("rlvr-f-plane").value = "";
            $("rlvr-f-dataset").value = "";
            $("rlvr-f-status").value = "";
            $("rlvr-f-limit").value = "48";
            $("rlvr-f-q").value = "";
            rlvr.refresh();
          });
          startTrainingPoll();
          rlvr.refresh();
        },

        refresh() {
          if (rlvr.state.mode === "sources") rlvr.loadSources();
          else rlvr.loadDetail();
        },

        buildQuery() {
          const p = new URLSearchParams();
          if (rlvr.state.plane) p.set("plane", rlvr.state.plane);
          if (rlvr.state.dataset) p.set("dataset", rlvr.state.dataset);
          if (rlvr.state.atlas) p.set("atlas", rlvr.state.atlas);
          if (rlvr.state.rlvr_status) p.set("rlvr_status", rlvr.state.rlvr_status);
          if (rlvr.state.q) p.set("q", rlvr.state.q);
          return p;
        },

        async loadSources() {
          const v = $("training-module");
          v.innerHTML = "";
          // Live progress strip, always rendered (even when empty).
          const strip = document.createElement("div");
          strip.id = "rlvr-progress-strip";
          v.appendChild(strip);
          rlvr.renderStrip(rlvr.lastStatus);

          const feed = document.createElement("div");
          feed.id = "rlvr-recent-feed";
          feed.className = "recent-feed";
          feed.style.display = "none";
          v.appendChild(feed);
          rlvr.renderFeed(rlvr.lastStatus);

          const sourceWrap = document.createElement("div");
          v.appendChild(sourceWrap);
          sourceWrap.innerHTML = "<div class='empty'>loading RLVR sources…</div>";

          let data;
          try {
            data = await fetchJSON(`/api/rlvr/sources?${rlvr.buildQuery()}`);
          } catch (err) {
            if (err.status === 404) {
              sourceWrap.innerHTML = `<div class='empty'>RLVR endpoint not yet wired in backend</div>`;
            } else {
              sourceWrap.innerHTML = `<div class='empty'>error: ${err.status || err.message}</div>`;
            }
            return;
          }
          // Populate dataset filter from result.
          const dsSet = new Set();
          (data.datasets || []).forEach((d) => dsSet.add(d.dataset));
          rlvr.fillDatasetFilter(dsSet);
          renderSourceCards(sourceWrap, data.datasets || [], {
            emptyHtml: "no RLVR sources yet — assign <code>split=\"rlvr\"</code> rows in <code>data/manifest.jsonl</code>",
            onCardClick: (d) => rlvr.drillInto(d.dataset),
            onSampleClick: (d, s) => rlvr.openSampleLightbox(d, s),
            getSampleThumbUrl: (s) => histThumbUrl(s.image_path, 96, 72),
            getSampleAtlasUrl: (s) => atlasUrl(s.atlas, s.orientation, s.position_mm),
            metaExtras: (d) => {
              const c = d.n_consumed != null ? d.n_consumed : 0;
              const q = d.n_queued != null ? d.n_queued : 0;
              const u = d.n_unseen != null ? d.n_unseen : 0;
              return `<span><span class="pill consumed">${c} consumed</span> ` +
                `<span class="pill queued">${q} queued</span> ` +
                `<span class="pill unseen">${u} unseen</span></span>`;
            },
          });
        },

        fillDatasetFilter(set) {
          const el = $("rlvr-f-dataset");
          if (!el) return;
          const cur = rlvr.state.dataset;
          el.innerHTML = `<option value="">(any)</option>`;
          for (const a of [...set].sort()) {
            const o = document.createElement("option");
            o.value = a; o.textContent = a;
            if (a === cur) o.selected = true;
            el.appendChild(o);
          }
        },

        async openSampleLightbox(d, sample) {
          const p = new URLSearchParams({
            dataset: d.dataset,
            limit: "500", offset: "0",
          });
          if (sample.subject_id) p.set("q", sample.subject_id);
          let items = [];
          try {
            const data = await fetchJSON(`/api/rlvr/manifest?${p}`);
            items = (data.items || []);
            items.sort((a, b) => {
              const pa = a.position_mm == null ? Infinity : Number(a.position_mm);
              const pb = b.position_mm == null ? Infinity : Number(b.position_mm);
              return pa - pb;
            });
          } catch (_) {
            items = [Object.assign({ dataset: d.dataset }, sample)];
          }
          if (!items.length) {
            items = [Object.assign({ dataset: d.dataset }, sample)];
          }
          let idx = 0;
          if (sample.section_id) {
            const i = items.findIndex((x) => x.section_id === sample.section_id);
            if (i >= 0) idx = i;
          }
          openLightbox(items, idx, rlvr.lbRender);
        },

        drillInto(dataset) {
          rlvr.state.dataset = dataset;
          rlvr.state.mode = "detail";
          rlvr.state.offset = 0;
          $("rlvr-f-dataset").value = dataset;
          rlvr.loadDetail();
        },

        async loadDetail() {
          const v = $("training-module");
          v.innerHTML = "";
          const strip = document.createElement("div");
          strip.id = "rlvr-progress-strip";
          v.appendChild(strip);
          rlvr.renderStrip(rlvr.lastStatus);
          const feed = document.createElement("div");
          feed.id = "rlvr-recent-feed";
          feed.className = "recent-feed";
          feed.style.display = "none";
          v.appendChild(feed);
          rlvr.renderFeed(rlvr.lastStatus);

          const crumb = document.createElement("div");
          crumb.className = "breadcrumb";
          crumb.innerHTML = `
            <button id="rlvr-back">← back to RLVR Sources</button>
            <span class="sep">/</span>
            <span class="cur">${escapeHtml(rlvr.state.dataset || "(filtered)")}</span>
          `;
          v.appendChild(crumb);
          $("rlvr-back").addEventListener("click", () => rlvr.toSources());

          const body = document.createElement("div");
          v.appendChild(body);
          body.innerHTML = "<div class='empty'>loading…</div>";

          const p = rlvr.buildQuery();
          p.set("limit", String(rlvr.state.limit));
          p.set("offset", String(rlvr.state.offset));
          let data;
          try {
            data = await fetchJSON(`/api/rlvr/manifest?${p}`);
          } catch (err) {
            body.innerHTML = `<div class='empty'>error: ${err.status || err.message}</div>`;
            return;
          }
          rlvr.items = data.items || [];
          body.innerHTML = "";
          if (!data.items || !data.items.length) {
            body.innerHTML = "<div class='empty'>no slices match current filters</div>";
            return;
          }
          const grid = document.createElement("div");
          grid.className = "grid";
          data.items.forEach((it, i) => {
            grid.appendChild(makePairTile(it, () =>
              openLightbox(data.items, i, rlvr.lbRender)
            ));
          });
          body.appendChild(grid);
          body.appendChild(makePager(data, (newOffset) => {
            rlvr.state.offset = newOffset;
            rlvr.loadDetail();
          }));
        },

        toSources() {
          rlvr.state.mode = "sources";
          rlvr.state.dataset = "";
          $("rlvr-f-dataset") && ($("rlvr-f-dataset").value = "");
          rlvr.refresh();
        },

        lbRender(item) {
          const pos = fmtPos(item.position_mm);
          const ds = item.dataset || "";
          const sub = item.subject_id || "";
          const sec = item.section_id || "";
          const meta =
            `<b>${escapeHtml(ds)}</b> / ${escapeHtml(sub)}` +
            ` · ${escapeHtml(sec)}` +
            ` · <b>${pos} mm</b>` +
            ` · ${escapeHtml(item.atlas || "")}` +
            ` · ${escapeHtml(item.orientation || "")}`;
          let pip = null;
          if (item.rlvr_status === "consumed") {
            let txt = "consumed";
            if (item.rlvr_step != null) txt = `consumed at step ${item.rlvr_step.toLocaleString()}`;
            if (item.rlvr_ts) txt += ` · ${ageString(item.rlvr_ts)}`;
            if (item.rlvr_queued_again) txt += " · re-queued";
            pip = { cls: "consumed", txt };
          } else if (item.rlvr_status === "queued") {
            pip = { cls: "queued", txt: "queued for next step" };
          }
          return {
            meta,
            rlvrPip: pip,
            panes: [
              { title: "histology", src: histFullUrl(item.image_path) },
              { title: "atlas", src: atlasUrl(item.atlas, item.orientation, item.position_mm) || "" },
            ],
          };
        },

        renderStrip(status) {
          const strip = $("rlvr-progress-strip");
          if (!strip) return;
          strip.className = "training-strip";
          if (!status || status.available === false) {
            strip.innerHTML = `
              <div class="stat">
                <span class="lbl">trainer</span>
                <span class="val" style="font-size:13px">awaiting trainer</span>
                <span class="lbl">no _local/rlvr_progress/ yet</span>
              </div>
              <div class="stat" style="margin-left:auto">
                <span class="pulse"><span class="dot"></span>idle</span>
              </div>`;
            return;
          }
          const parts = [];
          if (status.run) {
            const r = status.run;
            parts.push(`
              <div class="stat" style="min-width:160px">
                <span class="lbl">run</span>
                <span class="val" style="font-size:13px">${escapeHtml(r.config || "?")}</span>
                <span class="lbl">${r.target_steps ? `target ${r.target_steps} steps` : ""}</span>
              </div>
            `);
          }
          const rl = status.rlvr || {};
          const total = rl.n_total || 0;
          const pct = (n) => total ? `${Math.round((n / total) * 100)}%` : "0%";
          parts.push(`
            <div class="stat"><span class="lbl">consumed</span>
              <span class="val consumed">${rl.n_consumed || 0}</span>
              <span class="lbl">${pct(rl.n_consumed || 0)}</span>
            </div>
            <div class="stat"><span class="lbl">queued</span>
              <span class="val queued">${rl.n_queued || 0}</span>
              <span class="lbl">${rl.n_consumed_and_queued ? `(${rl.n_consumed_and_queued} re-train)` : ""}</span>
            </div>
            <div class="stat"><span class="lbl">unseen</span>
              <span class="val unseen">${rl.n_unseen || 0}</span>
              <span class="lbl">${pct(rl.n_unseen || 0)}</span>
            </div>
            <div class="stat"><span class="lbl">step</span>
              <span class="val" style="font-size:13px">
                ${status.current_step != null && status.current_step >= 0 ? status.current_step.toLocaleString() : "—"}
              </span>
              <span class="lbl">${status.run && status.run.target_steps ? `of ${status.run.target_steps}` : ""}</span>
            </div>
          `);
          const live = (trainingPoll.timer != null) && status.available !== false;
          const lastTs = status.last_consumed_ts ? `last update ${ageString(status.last_consumed_ts)}` :
            (status.available ? "no activity yet" : "trainer not started");
          parts.push(`
            <div class="stat" style="margin-left:auto">
              <span class="pulse ${live ? "live" : ""}"><span class="dot"></span>${live ? "live" : "idle"}</span>
              <span class="lbl">${escapeHtml(lastTs)}</span>
            </div>
          `);
          strip.innerHTML = parts.join("");
        },

        renderFeed(status) {
          const feed = $("rlvr-recent-feed");
          if (!feed) return;
          if (!status || !status.recent || !status.recent.length) {
            feed.style.display = "none";
            return;
          }
          feed.style.display = "";
          feed.classList.remove("empty");
          const rows = status.recent.map((ev) => {
            const id0 = (ev.ids && ev.ids[0]) || "";
            const more = ev.ids && ev.ids.length > 1
              ? ` <span style="color:var(--fg-mute)">+${ev.ids.length - 1}</span>` : "";
            const kindClass = ev.kind === "group" ? "group" : "";
            return `<div class="row">
              <span class="step">${ev.step != null ? ev.step.toLocaleString() : ""}</span>
              <span class="age">${escapeHtml(ageString(ev.ts))}</span>
              <span class="ids" title="${escapeHtml((ev.ids || []).join(", "))}">${escapeHtml(id0)}${more}</span>
              <span class="kind ${kindClass}">${escapeHtml(ev.kind || "single")}</span>
            </div>`;
          }).join("");
          feed.innerHTML = `<h4>recent activity (newest first)</h4>${rows}`;
        },
      };

      // RLVR live polling (only ticks while Training/RLVR is active and the
      // tab is visible). Uses /api/training/status?recent=20.
      const trainingPoll = {
        timer: null,
        intervalMs: 2000,
      };
      function startTrainingPoll() {
        if (trainingPoll.timer != null) return;
        trainingTick();
        trainingPoll.timer = setInterval(trainingTick, trainingPoll.intervalMs);
      }
      function stopTrainingPoll() {
        if (trainingPoll.timer == null) return;
        clearInterval(trainingPoll.timer);
        trainingPoll.timer = null;
      }
      async function trainingTick() {
        // Only poll when the QC hash route is #/training/rlvr.
        if (app.module !== "training" || app.sub.training !== "rlvr") return;
        if (document.visibilityState === "hidden") return;
        try {
          const data = await fetchJSON(`/api/training/status?recent=20`);
          rlvr.lastStatus = data;
          rlvr.renderStrip(data);
          rlvr.renderFeed(data);
        } catch (_) {
          // Polling errors are non-fatal; UI keeps last good state.
        }
      }
      document.addEventListener("visibilitychange", () => {
        if (app.module === "training" && app.sub.training === "rlvr"
            && document.visibilityState === "visible") {
          startTrainingPoll();
        } else {
          stopTrainingPoll();
        }
      });

      // ----- Eval sub-tab -----
      const evalmod = {
        state: { q: "" },
        items: [],

        mount() {
          const f = $("train-filters");
          f.innerHTML = `
            <input id="eval-f-q" type="text" placeholder="search dataset/subject" />
          `;
          let qt = null;
          $("eval-f-q").addEventListener("input", (e) => {
            evalmod.state.q = e.target.value;
            if (qt) clearTimeout(qt);
            qt = setTimeout(() => evalmod.renderList(), 250);
          });
          evalmod.load();
        },

        async load() {
          const v = $("training-module");
          v.innerHTML = "<div class='empty'>loading eval brains…</div>";
          let data;
          try {
            data = await fetchJSON(`/api/training/eval`);
          } catch (err) {
            if (err.status === 404) {
              v.innerHTML = `<div class='empty'>Eval endpoint not yet wired in backend</div>`;
            } else {
              v.innerHTML = `<div class='empty'>error: ${err.status || err.message}</div>`;
            }
            return;
          }
          evalmod.items = Array.isArray(data) ? data : (data.items || []);
          evalmod.renderList();
        },

        renderList() {
          const v = $("training-module");
          v.innerHTML = "";
          const wrap = document.createElement("div");
          wrap.className = "brain-list";
          v.appendChild(wrap);
          const q = (evalmod.state.q || "").toLowerCase().trim();
          const rows = evalmod.items.filter((b) => {
            if (!q) return true;
            return (b.dataset || "").toLowerCase().includes(q) ||
                   (b.subject_id || "").toLowerCase().includes(q);
          });
          if (!rows.length) {
            wrap.innerHTML = "<div class='empty'>no eval brains" +
              (q ? " match your search" : " yet — assign <code>split=\"eval\"</code> rows in <code>data/manifest.jsonl</code>") + "</div>";
            return;
          }
          rows.forEach((b) => {
            const card = document.createElement("div");
            card.className = "brain-card";
            const samples = (b.samples || []).slice(0, 3);
            card.innerHTML = `
              <div class="name">
                ${escapeHtml(b.subject_id || "(no subject)")}
                <span class="sub">${escapeHtml(b.dataset || "")}</span>
              </div>
              <div class="meta">
                <span><b>${b.n_sections || 0}</b> sections</span>
                <span><b>atlas</b> ${escapeHtml(b.atlas || "?")}</span>
                <span><b>plane</b> ${escapeHtml(b.plane || b.orientation || "?")}</span>
              </div>
              <div class="samp"></div>
            `;
            const sampWrap = card.querySelector(".samp");
            samples.forEach((s) => {
              const im = document.createElement("img");
              im.loading = "lazy";
              im.src = histThumbUrl(s.image_path, 200, 150);
              sampWrap.appendChild(im);
            });
            card.addEventListener("click", () => evalmod.drillInto(b));
            wrap.appendChild(card);
          });
        },

        async drillInto(b) {
          const v = $("training-module");
          v.innerHTML = "<div class='empty'>loading subject…</div>";
          // Use inventory-manifest to walk the brain (eval rows live in
          // data/manifest.jsonl, same shape as inventory rows).
          const p = new URLSearchParams({
            dataset: b.dataset || "",
            sort: "position",
            limit: "500", offset: "0",
          });
          if (b.subject_id) p.set("q", b.subject_id);
          let items = [];
          try {
            const data = await fetchJSON(`/api/inventory/manifest?${p}`);
            items = (data.items || []).filter((it) =>
              !b.subject_id || it.subject_id === b.subject_id
            );
            items.sort((a, b) => {
              const pa = a.position_mm == null ? Infinity : Number(a.position_mm);
              const pb = b.position_mm == null ? Infinity : Number(b.position_mm);
              return pa - pb;
            });
          } catch (_) {}
          v.innerHTML = "";
          const crumb = document.createElement("div");
          crumb.className = "breadcrumb";
          crumb.innerHTML = `
            <button id="eval-back">← back to Eval brains</button>
            <span class="sep">/</span>
            <span class="cur">${escapeHtml(b.dataset || "")} / ${escapeHtml(b.subject_id || "")}</span>
            <span class="sep">·</span>
            <span style="color:var(--fg-mute)">${items.length} sections</span>
          `;
          v.appendChild(crumb);
          $("eval-back").addEventListener("click", () => evalmod.renderList());
          if (!items.length) {
            const e = document.createElement("div");
            e.className = "empty";
            e.textContent = "no sections in this brain";
            v.appendChild(e);
            return;
          }
          const grid = document.createElement("div");
          grid.className = "grid";
          items.forEach((it, i) => {
            grid.appendChild(makePairTile(it, () =>
              openLightbox(items, i, inv.lbRender)
            ));
          });
          v.appendChild(grid);
        },
      };

      // ============================================================
      // SYNTH MODULE
      // ============================================================
      const synth = {
        state: {
          plane: "all",
          modality: "",
          atlas: "",
          mode: "",
          damage: "",
          sort: "position",
          q: "",
          limit: 48,
          offset: 0,
          phase: "sources",   // "sources" | "detail"
          // detail-mode key:
          detail: { modality: "", atlas: "", plane: "" },
        },
        items: [],
        mounted: false,

        mount() {
          if (!synth.mounted) {
            synth.bindFilters();
            synth.mounted = true;
          }
          synth.refresh();
        },

        bindFilters() {
          $("synth-f-modality").addEventListener("change", (e) => {
            synth.state.modality = e.target.value; synth.state.offset = 0; synth.refresh();
          });
          $("synth-f-atlas").addEventListener("change", (e) => {
            synth.state.atlas = e.target.value; synth.state.offset = 0; synth.refresh();
          });
          $("synth-f-mode").addEventListener("change", (e) => {
            synth.state.mode = e.target.value; synth.state.offset = 0; synth.refresh();
          });
          $("synth-f-damage").addEventListener("change", (e) => {
            synth.state.damage = e.target.value; synth.state.offset = 0; synth.refresh();
          });
          $("synth-f-sort").addEventListener("change", (e) => {
            synth.state.sort = e.target.value; synth.state.offset = 0; synth.refresh();
          });
          $("synth-f-limit").addEventListener("change", (e) => {
            synth.state.limit = parseInt(e.target.value, 10) || 48;
            synth.state.offset = 0; synth.refresh();
          });
          let qt = null;
          $("synth-f-q").addEventListener("input", (e) => {
            synth.state.q = e.target.value;
            if (qt) clearTimeout(qt);
            qt = setTimeout(() => { synth.state.offset = 0; synth.refresh(); }, 250);
          });
          $("synth-reset").addEventListener("click", () => {
            Object.assign(synth.state, {
              modality: "", atlas: "", mode: "", damage: "",
              sort: "position", q: "", limit: 48, offset: 0,
              phase: synth.state.phase, detail: synth.state.detail,
            });
            $("synth-f-modality").value = "";
            $("synth-f-atlas").value = "";
            $("synth-f-mode").value = "";
            $("synth-f-damage").value = "";
            $("synth-f-sort").value = "position";
            $("synth-f-limit").value = "48";
            $("synth-f-q").value = "";
            synth.refresh();
          });
          document.querySelectorAll("#synth-plane-tabs .tab").forEach((t) => {
            t.addEventListener("click", () => synth.setPlane(t.dataset.plane));
          });
        },

        setPlane(p) {
          synth.state.plane = p;
          synth.state.offset = 0;
          document.querySelectorAll("#synth-plane-tabs .tab").forEach((t) => {
            t.classList.toggle("active", t.dataset.plane === p);
          });
          synth.refresh();
        },

        refresh() {
          if (synth.state.phase === "sources") synth.loadSources();
          else synth.loadDetail();
        },

        async loadSources() {
          const v = $("synth-module");
          v.innerHTML = "<div class='empty'>loading synth sources…</div>";
          const p = new URLSearchParams();
          if (synth.state.plane && synth.state.plane !== "all") p.set("plane", synth.state.plane);
          if (synth.state.modality) p.set("modality", synth.state.modality);
          if (synth.state.atlas) p.set("atlas", synth.state.atlas);
          if (synth.state.mode) p.set("mode", synth.state.mode);
          if (synth.state.damage) p.set("damage", synth.state.damage);
          if (synth.state.q) p.set("q", synth.state.q);
          let data;
          try {
            data = await fetchJSON(`/api/synth/datasets?${p}`);
          } catch (err) {
            if (err.status === 404) {
              v.innerHTML = synth.emptyHtml();
            } else {
              v.innerHTML = `<div class='empty'>error: ${err.status || err.message}</div>`;
            }
            return;
          }
          synth.populateFilters(data.datasets || []);
          synth.renderSources(data);
        },

        emptyHtml() {
          return `<div class='empty'>no synth data yet — run <code>python -m synth_dataset write --out _local/synth_data --n 100</code></div>`;
        },

        populateFilters(datasets) {
          const fillSel = (id, set, cur) => {
            const el = $(id);
            if (!el) return;
            el.innerHTML = `<option value="">(any)</option>`;
            for (const v of [...set].filter(Boolean).sort()) {
              const o = document.createElement("option");
              o.value = v; o.textContent = v;
              if (v === cur) o.selected = true;
              el.appendChild(o);
            }
          };
          const mods = new Set();
          const atls = new Set();
          const modes = new Set();
          const dmgs = new Set();
          datasets.forEach((d) => {
            if (d.modality) mods.add(d.modality);
            if (d.atlas_name) atls.add(d.atlas_name);
            (d.modes || []).forEach((m) => modes.add(m));
            (d.damage_intensities || []).forEach((x) => dmgs.add(x));
          });
          fillSel("synth-f-modality", mods, synth.state.modality);
          fillSel("synth-f-atlas", atls, synth.state.atlas);
          fillSel("synth-f-mode", modes, synth.state.mode);
          fillSel("synth-f-damage", dmgs, synth.state.damage);
        },

        renderSources(data) {
          const v = $("synth-module");
          v.innerHTML = "";
          if (!data.datasets || !data.datasets.length) {
            v.innerHTML = synth.emptyHtml();
            return;
          }
          // Adapter: synth datasets group by (modality, atlas, plane).
          // renderSourceCards expects {dataset, samples, planes...}; adapt
          // each row so it still renders cleanly.
          const adapted = data.datasets.map((d) => Object.assign({}, d, {
            dataset: `${d.modality || "?"} · ${d.atlas_name || "?"} · ${d.plane || "?"}`,
            atlases: d.atlas_name ? [d.atlas_name] : [],
            // Keep plane breakdown empty since each card is single-plane.
          }));
          renderSourceCards(v, adapted, {
            emptyHtml: "no synth datasets match current filters",
            onCardClick: (d) => synth.drillInto(d),
            onSampleClick: (d, s) => synth.openSampleLightbox(d, s),
            getSampleThumbUrl: (s) => synthThumbUrl(s.seed, 96, 72, s.image_mtime || 0),
            getSampleAtlasUrl: (s) =>
              atlasUrl(s.atlas_name || (s.atlas) || "",
                       s.plane || s.orientation, s.position_mm),
            metaExtras: (d) => {
              const parts = [];
              if (d.modes && d.modes.length) parts.push(`<span><b>modes</b> ${d.modes.map(escapeHtml).join(", ")}</span>`);
              if (d.damage_intensities && d.damage_intensities.length)
                parts.push(`<span><b>damage</b> ${d.damage_intensities.map(escapeHtml).join(", ")}</span>`);
              return parts.join("");
            },
          });
        },

        async openSampleLightbox(d, sample) {
          // Walk the source's seeds via /api/synth/manifest.
          const items = await synth.fetchSourceItems(d);
          if (!items.length) {
            openLightbox([sample], 0, synth.lbRender);
            return;
          }
          let idx = 0;
          if (sample.seed != null) {
            const i = items.findIndex((x) => x.seed === sample.seed);
            if (i >= 0) idx = i;
          }
          openLightbox(items, idx, synth.lbRender);
        },

        async fetchSourceItems(d) {
          const p = new URLSearchParams({ limit: "500", offset: "0" });
          if (d.modality) p.set("modality", d.modality);
          if (d.atlas_name) p.set("atlas", d.atlas_name);
          if (d.plane) p.set("plane", d.plane);
          try {
            const data = await fetchJSON(`/api/synth/manifest?${p}`);
            return data.items || [];
          } catch (_) {
            return [];
          }
        },

        drillInto(d) {
          synth.state.detail = {
            modality: d.modality || "",
            atlas: d.atlas_name || "",
            plane: d.plane || "",
          };
          synth.state.phase = "detail";
          synth.state.offset = 0;
          synth.loadDetail();
        },

        async loadDetail() {
          const v = $("synth-module");
          v.innerHTML = "<div class='empty'>loading…</div>";
          const p = new URLSearchParams();
          if (synth.state.detail.modality) p.set("modality", synth.state.detail.modality);
          if (synth.state.detail.atlas) p.set("atlas", synth.state.detail.atlas);
          if (synth.state.detail.plane) p.set("plane", synth.state.detail.plane);
          if (synth.state.mode) p.set("mode", synth.state.mode);
          if (synth.state.damage) p.set("damage", synth.state.damage);
          if (synth.state.q) p.set("q", synth.state.q);
          if (synth.state.sort) p.set("sort", synth.state.sort);
          p.set("limit", String(synth.state.limit));
          p.set("offset", String(synth.state.offset));
          let data;
          try {
            data = await fetchJSON(`/api/synth/manifest?${p}`);
          } catch (err) {
            v.innerHTML = `<div class='empty'>error: ${err.status || err.message}</div>`;
            return;
          }
          synth.items = data.items || [];
          synth.renderDetail(data);
        },

        renderDetail(data) {
          const v = $("synth-module");
          v.innerHTML = "";
          const det = synth.state.detail;
          const crumb = document.createElement("div");
          crumb.className = "breadcrumb";
          crumb.innerHTML = `
            <button id="synth-back">← back to Synth Sources</button>
            <span class="sep">/</span>
            <span class="cur">${escapeHtml(det.modality || "?")} · ${escapeHtml(det.atlas || "?")} · ${escapeHtml(det.plane || "?")}</span>
            <span class="sep">·</span>
            <span style="color:var(--fg-mute)">${data.total || 0} samples</span>
          `;
          v.appendChild(crumb);
          $("synth-back").addEventListener("click", () => synth.toSources());

          if (!data.items || !data.items.length) {
            const e = document.createElement("div");
            e.className = "empty";
            e.textContent = "no synth samples match current filters";
            v.appendChild(e);
            return;
          }
          const grid = document.createElement("div");
          grid.className = "grid";
          data.items.forEach((it, i) => {
            grid.appendChild(synth.makeTile(it, () =>
              openLightbox(data.items, i, synth.lbRender)
            ));
          });
          v.appendChild(grid);
          v.appendChild(makePager(data, (newOffset) => {
            synth.state.offset = newOffset;
            synth.loadDetail();
          }));
        },

        toSources() {
          synth.state.phase = "sources";
          synth.state.detail = { modality: "", atlas: "", plane: "" };
          synth.refresh();
        },

        makeTile(it, onClick) {
          const el = document.createElement("div");
          el.className = "tile";
          el.dataset.id = it.id || it.seed || "";
          const pair = document.createElement("div");
          pair.className = "pair";
          const im1 = document.createElement("img");
          im1.loading = "lazy"; im1.alt = "synth";
          im1.src = synthThumbUrl(it.seed, 240, 240, it.image_mtime || 0);
          pair.appendChild(im1);
          const im2 = document.createElement("img");
          im2.loading = "lazy"; im2.alt = "atlas";
          const at = atlasUrl(it.atlas_name || it.atlas, it.plane || it.orientation, it.position_mm);
          if (at) im2.src = at;
          pair.appendChild(im2);
          const cap = document.createElement("div");
          cap.className = "cap";
          const pos = fmtPos(it.position_mm);
          cap.innerHTML = `<span class="pos">${pos}mm</span> · seed ${it.seed != null ? it.seed : "?"}`;
          const cap2 = document.createElement("div");
          cap2.className = "cap";
          cap2.style.color = "var(--fg-mute)";
          const dmg = it.apply_damage ? `damage:${it.damage_intensity || "?"}` : "no damage";
          cap2.textContent = `${it.modality || "?"} · ${it.mode || "?"} · ${dmg}`;
          el.appendChild(pair);
          el.appendChild(cap);
          el.appendChild(cap2);
          el.title = `seed ${it.seed} · ${it.modality}/${it.mode}\n${pos}mm · ${it.atlas_name || ""}`;
          el.addEventListener("click", (e) => {
            e.preventDefault();
            if (onClick) onClick();
          });
          return el;
        },

        lbRender(item) {
          const pos = fmtPos(item.position_mm);
          const dmg = item.apply_damage ? `damage:${item.damage_intensity || "?"}` : "no damage";
          const meta =
            `<b>seed ${item.seed != null ? item.seed : "?"}</b>` +
            ` · ${escapeHtml(item.modality || "?")}/${escapeHtml(item.mode || "?")}` +
            ` · <b>${pos} mm</b>` +
            ` · ${escapeHtml(item.atlas_name || item.atlas || "")}` +
            ` · ${escapeHtml(item.plane || item.orientation || "")}` +
            ` · ${escapeHtml(dmg)}`;
          return {
            meta,
            rlvrPip: null,
            panes: [
              { title: "synthetic", src: synthFullUrl(item.seed, item.image_mtime || 0) },
              { title: "atlas",
                src: atlasUrl(item.atlas_name || item.atlas,
                              item.plane || item.orientation, item.position_mm) || "" },
            ],
          };
        },
      };

      // ============================================================
      // GLOBAL HOTKEY DISPATCHER
      // Final hotkey set: ←/→/Home/End/Esc in lightbox; 1/2/3/0 plane;
      // / focus search; ? help. (Verdict hotkeys removed entirely.)
      // ============================================================
      document.addEventListener("keydown", (e) => {
        // Don't hijack keys while user is typing in an input/select.
        if (document.activeElement) {
          const tag = document.activeElement.tagName;
          if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") {
            // Esc still closes lightbox even if focus is in an input that
            // happens to live inside it; otherwise let the input handle keys.
            if (e.key === "Escape" && lightboxOpen()) {
              e.preventDefault(); closeLightbox();
            }
            return;
          }
        }
        // Lightbox-scoped keys.
        if (lightboxOpen()) {
          if (e.key === "Escape") { e.preventDefault(); closeLightbox(); return; }
          if (e.key === "ArrowLeft") { e.preventDefault(); lightboxNav(-1); return; }
          if (e.key === "ArrowRight") { e.preventDefault(); lightboxNav(1); return; }
          if (e.key === "Home") { e.preventDefault(); lightboxJump(0); return; }
          if (e.key === "End") { e.preventDefault(); lightboxJump(lb.items.length - 1); return; }
          // Block fall-through; we don't switch planes / modules from inside the lightbox.
          return;
        }
        // Plane filter (only meaningful for inventory + synth).
        if (e.key === "1" || e.key === "2" || e.key === "3" || e.key === "0") {
          const plane = e.key === "1" ? "coronal"
            : e.key === "2" ? "sagittal"
            : e.key === "3" ? "horizontal" : "all";
          if (app.module === "inventory") inv.setPlane(plane);
          else if (app.module === "synth") synth.setPlane(plane);
          return;
        }
        if (e.key === "/") {
          // Focus the active module's search input.
          let target = null;
          if (app.module === "inventory") target = $("inv-f-q");
          else if (app.module === "synth") target = $("synth-f-q");
          else if (app.module === "training") {
            if (app.sub.training === "sft") target = $("sft-f-q");
            else if (app.sub.training === "rlvr") target = $("rlvr-f-q");
            else if (app.sub.training === "eval") target = $("eval-f-q");
          }
          if (target) { e.preventDefault(); target.focus(); }
          return;
        }
        if (e.key === "?") {
          e.preventDefault();
          $("help-dialog").classList.toggle("show");
          return;
        }
      });

      // ============================================================
      // BOOT
      // ============================================================
      // Wire the lightbox DOM.
      lb.el = $("lightbox");
      lb.meta = $("lb-meta");
      lb.rlvr = $("lb-rlvr");
      lb.position = $("lb-position");
      lb.panes = $("lb-panes");
      $("lb-close").addEventListener("click", closeLightbox);
      $("lb-prev").addEventListener("click", () => lightboxNav(-1));
      $("lb-next").addEventListener("click", () => lightboxNav(1));
      // Click on the dimmed backdrop closes the box.
      lb.el.addEventListener("click", (e) => {
        if (e.target === lb.el) closeLightbox();
      });

      // Wire module strip.
      document.querySelectorAll("#module-strip button").forEach((t) => {
        t.addEventListener("click", () => setModule(t.dataset.module));
      });

      // Hashroute-driven landing.
      const route = readHashRoute();
      if (route) {
        if (route.module === "training" && route.sub) {
          app.sub.training = route.sub;
        }
        setModule(route.module, { skipHash: true });
      } else {
        setModule("inventory");
      }
      // Respond to back/forward navigation (best-effort).
      window.addEventListener("hashchange", () => {
        const r = readHashRoute();
        if (!r) return;
        if (r.module !== app.module) {
          if (r.module === "training" && r.sub) app.sub.training = r.sub;
          setModule(r.module, { skipHash: true });
        } else if (r.module === "training" && r.sub && r.sub !== app.sub.training) {
          training.setSub(r.sub);
        }
      });
    </script>
  </body>
</html>
