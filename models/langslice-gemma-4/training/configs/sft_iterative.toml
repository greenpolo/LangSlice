# Expert-iteration SFT configuration.
# Used by `iSFT.iterate.py` per-round SFT retrain.
# Differs from sft_default.toml in: base_model points at the merged-bf16
# anchor (instead of bare unsloth/gemma-4-E4B-it). This avoids the
# double-LoRA-application bug where an --initial-adapter trained from
# bare unsloth gets re-applied on top of an already-merged base.
#
# Math: with base_model = merged-bf16 anchor:
#   train_sft loads merged-bf16 (= base + prior SFT baked in)
#   FastVisionModel.get_peft_model adds a FRESH r=16 LoRA on top
#   Training updates ONLY the fresh LoRA -> output adapter = pure delta
#   vLLM merge or hot-swap onto merged-bf16 = base + prior + delta. ✓
#
# Don't pass --initial-adapter when using this config — the prior SFT
# weights are already in the base via the merged-bf16, and adding an
# initial-adapter on top would re-introduce the double-application bug.

[sft]
# Loaded from the langslice-models-fast named volume, mounted at /models:ro
# in the training service (see docker-compose.training.yml). This is the
# same volume vLLM uses, populated via _local/iSFT/copy-volume-override.yml.
# Avoids the ~90 sec/step slowdown caused by loading from the slow
# Windows-NTFS-via-WSL2 bind mount.
base_model = "/models/sft-base"
load_in_4bit = true
max_seq_length = 6144
# 2 epochs was the prior frozen-vision default; dropped to 1.5 for the vision-on
# 5k-row round (2026-05-12) — the larger eff-batch (24 vs 16) means more shaping
# per epoch already, and 1.5 keeps total wall time near 4h while still giving
# the vision LoRA enough exposure for late-epoch stabilisation.
num_train_epochs = 1.5
# Bumped PDBS 1 -> 2 (2026-05-12 AM), then 2 -> 4 (2026-05-12 PM) after the
# image-cap=8 landed in synth_corpus and let PDBS=4 fit cleanly at ~30 GB peak.
# Effective batch = 32. Validated via sft_vram_smoke.ps1 -Pdbs 4 against the
# capped corpus: peak 29.99 GB, 40-41 s/it warm, 0.79 samples/sec. See memory
# `reference_gemma4_sft_frozen_vision_defaults` for the full recipe.
#
# IMPORTANT: PDBS=4 is the frozen-vision (finetune_vision_layers=false) recipe.
# For the vision-on experiment (finetune_vision_layers=true, r=32, use_rslora),
# PDBS dropped 4 -> 2 (2026-05-12 vision-on pivot smoke). The PDBS=2 vision-on
# smoke passed at peak 24.14 GB; PDBS=3 vision-on smoke validated at peak
# ~28.96 GB (3.56 GB headroom under 31.84 GB). Locked at PDBS=3 — PDBS=4
# vision-on would cross the ceiling (frozen-vision PDBS=2→3 delta was +4.2 GB,
# vision-on tracks that, so PDBS=4 vision-on would be ~33 GB → OOM).
per_device_train_batch_size = 3
gradient_accumulation_steps = 8
learning_rate = 5e-5
lr_scheduler_type = "cosine"
warmup_ratio = 0.03
weight_decay = 0.01
# Added 2026-05-12 alongside the vision-on pivot. Frozen-vision steady-state
# grad_norm sat 0.15-0.25 and the PDBS=2 vision-on smoke peaked at 0.56, so
# 0.8 only catches a true anomaly without clipping healthy steps. Cheap
# insurance against bad early-vision-LoRA spikes corrupting weights.
max_grad_norm = 0.8
optim = "adamw_8bit"
chat_template_kwargs = { enable_thinking = false }
logging_steps = 5
# eval_strategy wires up held-out validation loss via trainer.evaluate.
# Without eval_strategy != "no" the trainer skips eval entirely — we discovered this
# 2026-05-12 (no eval_loss lines in the ckpt300-curr3r-vision run's log).
# "epoch" → 1-2 evals per 1.5-epoch run. Each evaluate() on the full holdout costs
# ~38 min teacher-forced (we initially under-estimated at 30-60 sec); "steps" with
# eval_steps=50 would have added ~3.8 h overhead to a 3 h run. Epoch-level catches
# gross divergence without dominating wall time. Bump to "steps" only for long
# (3+ epoch) overfit-watch runs.
# prediction_loss_only=true skips generation, returns CE only.
eval_strategy = "epoch"
prediction_loss_only = true
agent_eval_steps = 200
# Bumped 25 -> 100 (2026-05-12). Each save writes ~2 GB of adapter weights to
# slow NTFS-bind out/; 25 was the post-curriculum-bug-fix recovery cadence
# and is no longer needed. 100 keeps a save every ~5 min while cutting write
# overhead 4x. Restore to 25 if a future loss-curve investigation needs it.
save_steps = 100
report_to = "trackio"
seed = 0
# Bumped 8 -> 16 (2026-05-12). DRAM headroom at training peak was ~80 GB free
# during the ckpt300-curr3r run; more workers hide per-row JPEG-decode +
# CLAHE jitter behind compute.
# Bumped 16 -> 24 (2026-05-12, later). Sawtooth GPU utilization during the
# ckpt300-curr3r run showed the dataloader was still bottlenecking; more
# in-flight micro-batches mask per-step prep jitter, DRAM is comfortable.
# Bumped 24 -> 32 (2026-05-12, even later). Host has 24 fast cores; workers
# are IO-bound (JPEG decode + tokenize) so 1.33x cores oversubscribes well.
dataloader_num_workers = 32
dataloader_persistent_workers = true
dataloader_pin_memory = true
# Bumped 2 -> 4 (2026-05-12, later) — see below.
# Bumped 4 -> 6 (2026-05-12, even later). With 32 workers * 6 prefetch = 192
# buffered batches (~10-20 GB DRAM at PDBS=4) — masks longer dataloader
# hiccups. The earlier 16*4=64 was flagged as DRAM-wasteful, but the smoke
# run showed headroom (~80 GB free); we want the buffer to mask hiccups,
# not minimise DRAM use. Revisit if the smoke shows DRAM pressure.
dataloader_prefetch_factor = 6

[lora]
# Vision-on experiment values (2026-05-12 pivot): r bumped 16 -> 32, use_rslora
# turned on, finetune_vision_layers flipped true. Not yet validated for prod;
# running smoke to characterise VRAM + throughput + healthy gradient flow.
# Frozen-vision baseline was r=16, finetune_vision_layers=false, no use_rslora.
r = 32
lora_alpha = 32
use_rslora = true
finetune_vision_layers = true
finetune_language_layers = true
finetune_attention_modules = true
finetune_mlp_modules = true
use_gradient_checkpointing = "unsloth"

[data]
holdout_fraction = 0.10
include_rationale = false
