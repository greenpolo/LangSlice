# 10-step VRAM smoke for the nosplice ablation. Same config as
# sft_overnight_thinking_signature_nosplice.toml except: max_steps=10,
# no eval/save during the smoke. Use to verify VRAM headroom before
# committing to the 75-step run.

[sft]
base_model = "unsloth/gemma-4-E4B-it"
load_in_4bit = true
max_seq_length = 4096
num_train_epochs = 1
max_steps = 10
per_device_train_batch_size = 2
gradient_accumulation_steps = 12
per_device_eval_batch_size = 3
learning_rate = 2e-4
lr_scheduler_type = "cosine"
warmup_ratio = 0.03
weight_decay = 0.01
max_grad_norm = 0.8
optim = "adamw_8bit"
chat_template_kwargs = { enable_thinking = false }
logging_steps = 1
eval_strategy = "no"
prediction_loss_only = true
agent_eval_steps = 99999
save_strategy = "no"
report_to = "none"
seed = 42
dataloader_num_workers = 32
dataloader_persistent_workers = true
dataloader_pin_memory = true
dataloader_prefetch_factor = 6

[lora]
r = 512
lora_alpha = 16
use_rslora = true
finetune_vision_layers = false
finetune_language_layers = true
finetune_attention_modules = true
finetune_mlp_modules = true
use_gradient_checkpointing = "unsloth"

[data]
holdout_fraction = 0.10
include_rationale = false
