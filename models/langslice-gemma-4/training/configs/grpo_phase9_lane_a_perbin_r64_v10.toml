# Phase 9 v10 — Lane A single-turn GRPO, per-bin adaptive reward.
#
# Continues the v1.0 lineage (resume from v7 ckpt-300 = blessed
# langslice-gemma-4-E4B v1.0). Identical to grpo_phase9_lane_a_tool_call_r64_v4
# EXCEPT the reward: v9 (cum step 300->1200) showed the plane-global adaptive
# sigma is *self-normalizing* — it re-centres on the model's own median error,
# so from an already-good checkpoint it hands out the same ~0.2 mean reward at
# 9% axis error as at 18% and produces lateral churn instead of absolute gains.
#
# v9 -> v10 reward change (see [adaptive] below):
#   - per_bin = true: each AP-coordinate bin derives its OWN bell width from
#     its OWN recent error history. A coordinate range the policy has mastered
#     tightens (small sigma, steep bell, still a live gradient to refine) while
#     a range it's weak at stays lenient (wide sigma, reward for getting
#     closer). The model is always chasing a peak, and the peak differs by
#     coordinate range. Directly attacks the ~28% zero-reward-variance steps
#     (good bins were saturating the old plane-wide bell at reward ~1).
#   - min_sigma_frac = 0.02: the per-bin sigma floor — the fixed precision
#     "peak" a mastered bin chases (2% of axis). Stops the tightening from
#     running below GT/atlas label noise. (Was the 0.005 default in v4.)
#   - min_bin_observations = 12: a bin uses its own sigma only after 12
#     observations; below that it falls back to the plane-global sigma.
#
# All units are % of axis (fraction-of-axis sigma_frac), never raw mm.
#
# Pairs with the eos-rewrite inference-tensor fix (now on main): without it the
# post-submit EOS rewrite silently no-ops under torch.inference_mode(), which
# is what made v9 loop/time-out on OOD brightfield (m287) at eval.

[grpo]
chat_template_kwargs = { enable_thinking = false }
generation_kwargs = { stop_strings = ["<tool_call|>", "<end_of_turn>"] }
submit_estimate_stop_criterion = true
learning_rate = 1e-6
num_generations = 3
generation_batch_size = 3
per_device_train_batch_size = 1
gradient_accumulation_steps = 8
max_completion_length = 512
dataloader_num_workers = 16
dataloader_pin_memory = true
dataloader_persistent_workers = true
dataloader_prefetch_factor = 4
max_grad_norm = 0.1
importance_sampling_level = "sequence"
loss_type = "dapo"
mask_truncated_completions = false
scale_rewards = "batch"
temperature = 1.5
top_p = 1.0
optim = "adamw_8bit"
log_completions = true
logging_steps = 1
save_steps = 50
max_steps = 2224
report_to = "none"
load_in_4bit = false
max_seq_length = 8192

[lora]
finetune_vision_layers = false
finetune_language_layers = true
finetune_attention_modules = true
finetune_mlp_modules = true
r = 64
lora_alpha = 8
use_rslora = true
use_gradient_checkpointing = "unsloth"

[data]
eval_holdout_every = 5
curriculum_round = 0

[reward]
cutoff_frac = 0.25
# Static fallback sigma used only during cold start (before any bin/plane has
# min observations). Unchanged from v4.
sigma_frac = 0.10
format_penalty = -0.3
out_of_range_reward = 0.0

[adaptive]
target_reward = 0.3
eta = 0.03
d_min = 0.2
# Per-bin sigma range: a mastered bin floors at 2% of axis (the "peak"), a weak
# bin is capped at 15% of axis (lenient). max_sigma_frac unchanged from v4;
# min_sigma_frac raised 0.005 -> 0.02 so the model chases a real target, not
# label noise.
min_sigma_frac = 0.02
max_sigma_frac = 0.15
# THE v10 change: per-coordinate-range adaptive sigma.
per_bin = true
min_bin_observations = 12
# Per-bin coverage quota (unchanged from v4): every AP bin gets >= 20 gradient
# updates before AdaRFT is allowed to concentrate; 2 of 8 slots per batch are
# reserved for the most-deficit bins until then.
min_visits_per_bin = 20
quota_slots_per_batch = 2
