# Tiny SFT config for splice smoke testing — runs ~8 steps and exits.
# Used to confirm the atlas-embedding splice doesn't crash and produces
# losses in the same range as a no-splice baseline run with the same seed.

[sft]
base_model = "unsloth/gemma-4-E4B-it"
load_in_4bit = true
max_seq_length = 6144
num_train_epochs = 1
max_steps = 8
per_device_train_batch_size = 1
gradient_accumulation_steps = 1
learning_rate = 2e-4
lr_scheduler_type = "constant"
warmup_ratio = 0.0
weight_decay = 0.0
optim = "adamw_8bit"
chat_template_kwargs = { enable_thinking = false }
logging_steps = 1
eval_steps = 999
agent_eval_steps = 999
save_steps = 999
report_to = "none"
seed = 42
dataloader_num_workers = 0
dataloader_persistent_workers = false
dataloader_pin_memory = true

[lora]
r = 16
lora_alpha = 32
finetune_vision_layers = false
finetune_language_layers = true
finetune_attention_modules = true
finetune_mlp_modules = true
use_gradient_checkpointing = "unsloth"

[data]
holdout_fraction = 0.10
include_rationale = false
