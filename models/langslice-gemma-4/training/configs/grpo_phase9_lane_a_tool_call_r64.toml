# Phase 9 — Lane A single-turn GRPO with the production ADK tool-call
# contract (slicebench-compatible), starting from base Gemma 4 E4B-IT.
#
# Differences vs grpo_single_turn_terminal.toml:
#   - LoRA rank bumped to r=64 with rsLoRA (vs r=16 plain), matching the
#     Phase 8 SFT recipe that proved tolerable on this base. Per
#     feedback_rslora_high_rank_for_domain_adaptation, r=64-128 is the
#     default narrow-task LoRA rank; r=256 (Phase 7) was too aggressive.
#   - Curriculum disabled — Agent A flagged that AdaRFT consumes raw
#     GRPO reward including -1 format penalties, which can self-sabotage
#     the schedule early. Hackathon: run without curriculum first.
#   - max_completion_length 512 — E4B-IT prefixes its tool call with prose
#     reasoning (~200-400 tokens) before emitting `call:submit_estimate{...}`,
#     so 384 truncated ~75% of completions in smoke. 512 cuts that to ~50%.
#   - max_seq_length kept at 8192; prefix = 4 atlas refs (avg per Lane A) +
#     target image + system text ≈ 6.3k tokens, completion 512 → 6.8k peak.
#   - Reward parser accepts BOTH the wrapped form
#     `<|tool_call>call:submit_estimate{...}<tool_call|>` AND the bare form
#     `call:submit_estimate{...}` (E4B-IT in reasoning mode omits the
#     leading sentinel and emits the call inline after prose).
#   - Tool-declaration block is baked into the system prompt at row-build
#     time (single_turn_rl/dataset.py:_GEMMA4_TOOL_DECLARATIONS) because
#     GRPOTrainer accepts callable tools (which would trigger unwanted
#     multi-turn rollouts) but not schema-only tools.

[grpo]
chat_template_kwargs = { enable_thinking = false }
learning_rate = 1e-6
num_generations = 2
generation_batch_size = 2
per_device_train_batch_size = 1
gradient_accumulation_steps = 8
max_completion_length = 512
dataloader_num_workers = 16
dataloader_pin_memory = true
dataloader_persistent_workers = true
dataloader_prefetch_factor = 4
max_grad_norm = 0.1
importance_sampling_level = "sequence"
loss_type = "dapo"
mask_truncated_completions = true
scale_rewards = "batch"
temperature = 1.5
top_p = 1.0
# top_k omitted — transformers' TopKLogitsWarper rejects top_k<=0; leave at HF default
optim = "adamw_8bit"
log_completions = true
logging_steps = 1
save_steps = 20
max_steps = 200
report_to = "none"
load_in_4bit = false
max_seq_length = 8192

[lora]
finetune_vision_layers = false
finetune_language_layers = true
finetune_attention_modules = true
finetune_mlp_modules = true
r = 64
lora_alpha = 8
use_rslora = true
use_gradient_checkpointing = "unsloth"

[data]
eval_holdout_every = 5
# max_examples = 200    # uncomment to cap rows for smoke runs
curriculum_round = 0

[reward]
cutoff_frac = 0.25
sigma_frac = 0.05
format_penalty = -1.0
out_of_range_reward = 0.0
