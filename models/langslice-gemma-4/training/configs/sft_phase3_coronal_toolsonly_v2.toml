# Phase 3 — coronal-only TOOLS-ONLY v2: full 56,772-row corpus
# (terminal tool_call rows resurrected by synthesizing submit_estimate
# from data/manifest/shards/coronal/ ground-truth position_mm).
#
# Hypothesis: Phase 2 plateau at ~3 mm coronal MAE was data-limited
# (15k rows after the terminal-submit filter). With 3.7× more data
# covering the harder "deeper-exploration" tool-call sequences, the
# model should find a better sweet spot.
#
# Dataset: combined_corpus_snapped_coronal_toolsonly_v2.jsonl
#
# Run plan: 1000 steps, checkpoint every 50. Same shape as Phase 2.
# 1000 × 24 = 24k row-views ≈ 0.5 epochs over the expanded corpus.
# ETA: ~5.5h at 21 sec/step.

[sft]
base_model = "unsloth/gemma-4-E4B-it"
load_in_4bit = true
max_seq_length = 4096
num_train_epochs = 1
max_steps = 1000
per_device_train_batch_size = 2
gradient_accumulation_steps = 12
per_device_eval_batch_size = 2
learning_rate = 2e-4
lr_scheduler_type = "cosine"
warmup_ratio = 0.03
weight_decay = 0.01
max_grad_norm = 0.8
optim = "adamw_8bit"
chat_template_kwargs = { enable_thinking = false }
logging_steps = 5
eval_strategy = "no"
prediction_loss_only = true
agent_eval_steps = 99999
save_strategy = "steps"
save_steps = 50
save_total_limit = 25
report_to = "none"
seed = 42
dataloader_num_workers = 32
dataloader_persistent_workers = true
dataloader_pin_memory = true
dataloader_prefetch_factor = 6

[lora]
r = 256
lora_alpha = 8
use_rslora = true
finetune_vision_layers = false
finetune_language_layers = true
finetune_attention_modules = true
finetune_mlp_modules = true
use_gradient_checkpointing = "unsloth"

[data]
holdout_fraction = 0.10
include_rationale = false
