[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langslice-harness"
version = "0.1.0"
description = "ADK harness for brain slice registration using image generation and BrainGlobe atlases"
requires-python = ">=3.10"
dependencies = [
    "google-genai",
    "google-adk",
    "litellm>=1.83.3",
    "backoff>=2.2.1",
    "openai",
    "brainglobe-atlasapi",
    "brainglobe-space",
    "numpy",
    "scipy",
    "Pillow",
    "tifffile",
    "python-dotenv",
    "itk-elastix",
]

[project.scripts]
langslice = "langslice_harness.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "basedpyright",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["langslice_harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra"
pythonpath = ["src", "models/langslice-gemma-4/data", "models/langslice-gemma-4/training"]

[tool.ruff]
target-version = "py310"
line-length = 100
include = [
    "src/langslice_harness/**/*.py",
    "tests/test_*.py",
    "tests/*_test.py",
    "models/langslice-gemma-4/data/augmentation/**/*.py",
    "models/langslice-gemma-4/training/rlvr/**/*.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
include = ["src/langslice_harness", "tests"]
extraPaths = ["src", "models/langslice-gemma-4/data", "models/langslice-gemma-4/training"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
