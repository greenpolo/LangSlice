[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langslice"
version = "0.1.0"
description = "ADK harness for brain slice registration using image generation and BrainGlobe atlases"
requires-python = ">=3.10"
dependencies = [
    "google-genai",
    "google-adk",
    "pydantic>=2",
    "litellm>=1.83.3",
    "openai",
    "brainglobe-atlasapi",
    "brainglobe-space",
    "numpy",
    "opencv-python-headless",
    "scipy",
    "Pillow",
    "tifffile",
    "python-dotenv",
    "itk-elastix",
]

[project.scripts]
langslice = "langslice.cli:main"

[project.optional-dependencies]
abba = [
    "abba-python",
]
dev = [
    "pytest",
    "ruff",
    "basedpyright",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["langslice*"]

[tool.setuptools.package-data]
langslice = ["atlas/*.json", "integrations/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra -m 'not slow and not legacy_local'"
markers = [
    "slow: integration tests that load real atlases",
    "legacy_local: archived local-maintenance tests kept out of the default suite",
]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
include = [
    "src/langslice/**/*.py",
    "tests/test_*.py",
    "tests/*_test.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
include = ["src/langslice"]
extraPaths = ["src"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
