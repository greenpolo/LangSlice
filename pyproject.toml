[build-system]
# setuptools 77 reads the SPDX license expression below (PEP 639).
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langslice"
version = "0.2.1"
description = "Agent-driven registration of histological brain sections to BrainGlobe atlases"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Nash Baughman", email = "nfbaughman@gmail.com" }]
keywords = [
    "neuroscience", "brain-atlas", "histology", "registration", "brainglobe",
    "allen-atlas", "vision-language-model", "quint",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
# Python 3.11 only: FireANTs 1.5.0 pins SimpleITK 2.2.1, whose wheels stop at 3.11.
requires-python = ">=3.11,<3.12"
dependencies = [
    "google-genai",
    "google-adk",
    "pydantic>=2",
    "litellm>=1.83.3",
    "openai",
    "brainglobe-atlasapi>=3.0.1",
    # pandas 3.1 breaks BrainGlobe's atlas loading ("cannot safely cast
    # non-equivalent int64 to uint16" reading structures.csv, 2026-10-22, with
    # brainglobe-atlasapi 3.0.1 and 3.0.2); drop the cap once that is fixed upstream.
    "pandas<3.1",
    "brainglobe-space",
    "numpy",
    "opencv-python-headless",
    "scipy",
    "Pillow",
    "tifffile",
    # Codecs for compressed TIFFs (LZW, Deflate, JPEG and others): tifffile
    # reads them only through imagecodecs.
    "imagecodecs",
    # Windowed and pyramid-level TIFF reads (langslice.core.sections.native) go through
    # tifffile's zarr store; a deformation record's arrays are an OME-Zarr
    # store (langslice.core.fits.deformable.ome_warp).
    "zarr>=3",
    "python-dotenv",
    "itk-elastix",
    # The deformable engine (langslice.core.fits.deformable): fireants_syn and the
    # packaged trace_borders fit with FireANTs' SyN on torch (on the GPU when
    # torch sees one). FireANTs 1.5.0 is the newest release on PyPI, and PyPI
    # refuses a package whose dependency is a URL; its SGD optimizer composes
    # each step once, which LangSlice asks for by name (compose_n 1) where a
    # newer FireANTs takes the setting. FireANTs 1.5.0 pins SimpleITK 2.2.1,
    # so that is the SimpleITK installed. SimpleITK is the one dependency of
    # FireANTs it imports; it also runs N4 bias-field correction
    # of the preprocessed channel (langslice.core.sections.reading).
    "torch>=2.3",
    "SimpleITK>=2.2.1",
    "fireants==1.5.0",
    # The job folder's cross-process write lock (langslice.job.folder.lock).
    "filelock>=3.12",
]

[project.scripts]
langslice = "langslice.cli:main"
langslice-job = "langslice.doors.agent_cli.main:main"

[project.optional-dependencies]
# HDF5 reading (h5py). The deformable engine is a core dependency (above).
registration = [
    "h5py>=3.10",
]
mcp = [
    "mcp>=1.24,<2",
]
# The comparison engines, run in LangSlice's process (langslice.engines).
# DeepSlice 1.2.8's inference is vendored (MIT) and needs only CPU
# TensorFlow and the Keras 2 it is written for. TensorFlow 2.21 has no
# wheels for Intel Macs (nor has torch, so LangSlice itself installs
# nowhere there); the marker keeps a resolver from looking for them.
engines = [
    "tensorflow==2.21.*; sys_platform != 'darwin' or platform_machine == 'arm64'",
    "tf-keras==2.21.*; sys_platform != 'darwin' or platform_machine == 'arm64'",
    # SPOmiAlign's matcher, RoMa: the release SPOmiAlign (commit c7f8b7a)
    # vendors, its own code unchanged (langslice.engines.spomialign).
    "romatch==0.1.2",
]
# The LangSlice window as a desktop app of its own (hosts/gui/app.py):
# pywebview shows the page in the system's web view. Without it the window
# is a browser's app window.
window = [
    "pywebview>=6.1",
]
# Claude agent models via an Anthropic API key (``anthropic-api/<model>``,
# providers/anthropic_api.py, on ADK's AnthropicLlm).
anthropic = [
    "anthropic>=1.13",
    "httpx2",
]
dev = [
    "mcp>=1.24,<2",
    "pytest",
    "pytest-xdist",
    # Pinned: a new version can report or format differently.
    "ruff==0.17.3",
    # Pinned: a new version can report differently.
    "basedpyright==1.39.10",
    "numpydoc>=1.6",
    # The layer contracts below (tests/test_import_layers.py runs them).
    "import-linter>=2.1",
    "jsonschema>=4.18",
    # The anthropic-api provider's imports, for the type check.
    "anthropic>=1.13",
    "httpx2",
    # The docs build (docs/conf.py, `sphinx-build -W docs <out>`).
    "sphinx>=7.3",
    "myst-parser>=3",
    "pydata-sphinx-theme>=0.15",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.6",
]

[project.urls]
Homepage = "https://github.com/greenpolo/LangSlice"
Documentation = "https://langslice.readthedocs.io"
Repository = "https://github.com/greenpolo/LangSlice"
Issues = "https://github.com/greenpolo/LangSlice/issues"

[tool.uv]
# TensorFlow 2.21 (the engines extra) caps h5py below 3.15. uv keeps one
# version of a package for every install, so that cap would move h5py back
# for every LangSlice install; h5py's floor stays the higher of the two
# requirements (TensorFlow's 3.11, registration's 3.10). DeepSlice's network
# runs alike on h5py 3.16 (engines/deepslice/README.md). pip still honours
# TensorFlow's cap where the engines extra is installed.
override-dependencies = ["h5py>=3.11"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["langslice*"]

[tool.setuptools.package-data]
langslice = [
    "core/atlas/*.json", "hosts/gui/static/*", "engines/brainways/LICENSE",
    "engines/deepslice/LICENSE", "skills/*/SKILL.md", "skills/*/examples/*",
    "_vendor/emlddmm/LICENSE", "_vendor/emlddmm/NOTICE", "_vendor/stalign/LICENSE",
]

# The layered core's dependency rule (docs/developers/architecture.md): each
# layer imports only the layers below it. tests/test_import_layers.py runs
# `lint-imports`. Imports under `if TYPE_CHECKING:` are left out: a type
# named in an annotation is not a dependency at run time. No contract has
# `ignore_imports`: a violation is fixed by moving code, never listed.
[tool.importlinter]
root_package = "langslice"
exclude_type_checking_imports = true
include_external_packages = true

[[tool.importlinter.contracts]]
id = "layers"
name = "Layers: hosts > doors > engines > plugins > tools > job > core"
type = "layers"
containers = ["langslice"]
layers = ["hosts", "doors", "engines", "plugins", "tools", "job", "core"]

[[tool.importlinter.contracts]]
id = "no-models-below-doors"
name = "core, job, tools, plugins and engines import no provider, agent framework or model client"
type = "forbidden"
source_modules = [
    "langslice.core", "langslice.job", "langslice.tools", "langslice.plugins",
    "langslice.engines",
]
forbidden_modules = ["langslice.providers", "google", "litellm", "openai", "mcp"]

[[tool.importlinter.contracts]]
id = "providers-import-core-only"
name = "providers import no job, tool, door, host or engine"
type = "forbidden"
source_modules = ["langslice.providers"]
forbidden_modules = [
    "langslice.job", "langslice.tools", "langslice.plugins", "langslice.engines",
    "langslice.doors", "langslice.hosts",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["src/langslice/**/*.py", "tests/**/*.py"]
extend-exclude = ["src/langslice/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE001", "ERA001", "SLF001", "T201", "PLW0603", "RUF100"]

[tool.ruff.lint.per-file-ignores]
"src/langslice/cli.py" = ["T201"]
"src/langslice/doors/agent_cli/*.py" = ["T201"]
"src/langslice/doors/commands/*.py" = ["T201"]

[tool.ruff.lint.flake8-import-conventions.extend-aliases]
"numpy.typing" = "npt"
"dask.array" = "da"
"SimpleITK" = "sitk"

[tool.ruff.lint.pep8-naming]
extend-ignore-names = ["sitk"]

[tool.basedpyright]
include = ["src/langslice"]
exclude = ["src/langslice/_vendor", "**/__pycache__"]
extraPaths = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
