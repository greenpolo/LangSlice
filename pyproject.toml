[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langslice"
version = "0.1.0"
description = "ADK harness for brain slice registration using image generation and BrainGlobe atlases"
requires-python = ">=3.10"
dependencies = [
    "google-genai",
    "google-adk",
    "pydantic>=2",
    "litellm>=1.83.3",
    "openai",
    "brainglobe-atlasapi",
    "brainglobe-space",
    "numpy",
    "opencv-python-headless",
    "scipy",
    "Pillow",
    "tifffile",
    "python-dotenv",
    "itk-elastix",
    # The job folder's cross-process write lock (langslice.job.lock).
    "filelock>=3.12",
]

[project.scripts]
langslice = "langslice.cli:main"

[project.optional-dependencies]
# Deformable fit extras (langslice.core.deformable): the ANTs engine and the reader
# for ABBA's cached Allen Nissl volume. antspyx 0.6.x pins scipy<1.16 (and
# 0.6.2+ numpy<2.4), so installing it downgrades those two. 0.6.3 is the floor:
# the engine seeds fits through `ants.config`, which 0.6.1 lacks.
registration = [
    "antspyx>=0.6.3,<0.7; python_version < '3.14'",
    "h5py>=3.10",
]
abba = [
    "abba-python",
]
mcp = [
    "mcp>=1.24,<2",
]
dev = [
    "mcp>=1.24,<2",
    "pytest",
    "ruff",
    "basedpyright",
    # The layer contracts below (tests/test_import_layers.py runs them).
    "import-linter>=2.1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["langslice*"]

[tool.setuptools.package-data]
langslice = ["core/atlas/*.json", "hosts/integrations/static/*"]

# The layered core's dependency rule (docs/architecture_overview.md): each
# layer imports only the layers below it. tests/test_import_layers.py runs
# `lint-imports`. Imports under `if TYPE_CHECKING:` are left out: a type
# named in an annotation is not a dependency at run time. No contract has
# `ignore_imports`: a violation is fixed by moving code, never listed.
[tool.importlinter]
root_package = "langslice"
exclude_type_checking_imports = true
include_external_packages = true

[[tool.importlinter.contracts]]
id = "layers"
name = "Layers: hosts > doors : agent > ops > job > core"
type = "layers"
containers = ["langslice"]
layers = ["hosts", "doors : agent", "ops", "job", "core"]

[[tool.importlinter.contracts]]
id = "no-models-below-doors"
name = "core, job and ops import no provider, agent framework or model client"
type = "forbidden"
source_modules = ["langslice.core", "langslice.job", "langslice.ops"]
forbidden_modules = ["langslice.providers", "google", "litellm", "openai", "mcp"]

[[tool.importlinter.contracts]]
id = "providers-below-doors"
name = "providers import no job, operation, door, driver or host"
type = "forbidden"
source_modules = ["langslice.providers"]
forbidden_modules = [
    "langslice.job", "langslice.ops", "langslice.doors", "langslice.agent", "langslice.hosts",
]

[[tool.importlinter.contracts]]
id = "no-shims-inside"
name = "LangSlice imports none of the compatibility shims (they are for sibling repos)"
type = "forbidden"
source_modules = [
    "langslice.core", "langslice.job", "langslice.ops", "langslice.doors",
    "langslice.agent", "langslice.providers", "langslice.hosts",
]
forbidden_modules = [
    "langslice.linear", "langslice.atlas", "langslice.nonlinear", "langslice.integrations",
    "langslice.adk", "langslice.space", "langslice.oblique", "langslice.affine",
    "langslice.image_prep", "langslice.registration_handoff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra -m 'not slow and not legacy_local'"
markers = [
    "slow: integration tests that load real atlases",
    "legacy_local: archived local-maintenance tests kept out of the default suite",
]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
include = [
    "src/langslice/**/*.py",
    "tests/test_*.py",
    "tests/*_test.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
include = ["src/langslice"]
extraPaths = ["src"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
