[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langslice"
version = "0.1.0"
description = "Agent-driven registration of histological brain sections to BrainGlobe atlases"
requires-python = ">=3.11"
dependencies = [
    "google-genai",
    "google-adk",
    "pydantic>=2",
    "litellm>=1.83.3",
    "openai",
    "brainglobe-atlasapi>=3.0.1",
    # pandas 3.1 breaks BrainGlobe's atlas loading ("cannot safely cast
    # non-equivalent int64 to uint16" reading structures.csv, 2026-10-22, with
    # brainglobe-atlasapi 3.0.1 and 3.0.2); drop the cap once that is fixed upstream.
    "pandas<3.1",
    "brainglobe-space",
    "numpy",
    "opencv-python-headless",
    "scipy",
    "Pillow",
    "tifffile",
    # Codecs for compressed TIFFs (LZW, Deflate, JPEG and others): tifffile
    # reads them only through imagecodecs.
    "imagecodecs",
    # Windowed and pyramid-level TIFF reads (langslice.core.sections.native) go through
    # tifffile's zarr store; a deformation record's arrays are an OME-Zarr
    # store (langslice.core.fits.deformable.ome_warp).
    "zarr>=3",
    "python-dotenv",
    "itk-elastix",
    # The deformable engine (langslice.core.fits.deformable): fireants_syn and the
    # packaged trace_borders fit with FireANTs' SyN on torch (on the GPU when
    # torch sees one). FireANTs 1.5.1 is not on PyPI; its GitHub archive at
    # f8a9cc2 builds without the private submodule a git install trips on.
    # SimpleITK is the one dependency of FireANTs it imports; it also runs N4
    # bias-field correction and denoising of the preprocessed channel
    # (langslice.core.sections.reading).
    "torch>=2.3",
    "SimpleITK>=2.2.1",
    "fireants @ https://github.com/rohitrango/FireANTs/archive/f8a9cc259ab9113fc43bd99797000fa8fc34eb59.tar.gz",
    # The job folder's cross-process write lock (langslice.job.lock).
    "filelock>=3.12",
]

[project.scripts]
langslice = "langslice.cli:main"
langslice-job = "langslice.doors.agent_cli.main:main"

[project.optional-dependencies]
# HDF5 reading (h5py). The deformable engine is a core dependency (above).
registration = [
    "h5py>=3.10",
]
abba = [
    "abba-python",
]
mcp = [
    "mcp>=1.24,<2",
]
# Claude agent models via an Anthropic API key (``anthropic-api/<model>``,
# providers/anthropic_api.py, on ADK's AnthropicLlm).
anthropic = [
    "anthropic>=1.13",
    "httpx2",
]
dev = [
    "mcp>=1.24,<2",
    "pytest",
    "pytest-xdist",
    "ruff",
    "basedpyright",
    # The docstring validation hook the style checker runs (tools/stylecheck).
    "numpydoc>=1.6",
    # The layer contracts below (tests/test_import_layers.py runs them).
    "import-linter>=2.1",
    # The OME-NGFF schema check of the deformation records (tests/test_ome_warp.py).
    "jsonschema>=4.18",
    # The anthropic-api provider's imports (type check, tests/test_anthropic_api_provider.py).
    "anthropic>=1.13",
    "httpx2",
    # The docs build (docs/conf.py, `sphinx-build -W docs <out>`).
    "sphinx>=7.3",
    "myst-parser>=3",
    "pydata-sphinx-theme>=0.15",
    "sphinx-copybutton>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["langslice*"]

[tool.setuptools.package-data]
langslice = ["core/atlas/*.json", "hosts/abba/static/*", "hosts/gui/static/*"]

# The layered core's dependency rule (docs/developers/architecture.md): each
# layer imports only the layers below it. tests/test_import_layers.py runs
# `lint-imports`. Imports under `if TYPE_CHECKING:` are left out: a type
# named in an annotation is not a dependency at run time. No contract has
# `ignore_imports`: a violation is fixed by moving code, never listed.
[tool.importlinter]
root_package = "langslice"
exclude_type_checking_imports = true
include_external_packages = true

[[tool.importlinter.contracts]]
id = "layers"
name = "Layers: hosts, engines > doors > tools > job > core"
type = "layers"
containers = ["langslice"]
layers = ["hosts : engines", "doors", "tools", "job", "core"]

[[tool.importlinter.contracts]]
id = "no-models-below-doors"
name = "core, job and tools import no provider, agent framework or model client"
type = "forbidden"
source_modules = ["langslice.core", "langslice.job", "langslice.tools"]
forbidden_modules = ["langslice.providers", "google", "litellm", "openai", "mcp"]

[[tool.importlinter.contracts]]
id = "providers-import-core-only"
name = "providers import no job, tool, door, host or engine"
type = "forbidden"
source_modules = ["langslice.providers"]
forbidden_modules = [
    "langslice.job", "langslice.tools", "langslice.doors", "langslice.hosts",
    "langslice.engines",
]

[[tool.importlinter.contracts]]
id = "engines-import-plugin-api-only"
name = "engines import the plugin API only, no layer and no provider"
type = "forbidden"
# The plugin API itself reaches the layers; an engine may not reach them
# past it.
allow_indirect_imports = true
source_modules = ["langslice.engines"]
forbidden_modules = [
    "langslice.core", "langslice.job", "langslice.tools", "langslice.doors",
    "langslice.hosts", "langslice.providers",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
# Tests run in parallel; an idle worker takes queued tests from a busy one.
addopts = "-ra -m 'not slow and not golden' -n auto --dist worksteal"
markers = [
    "slow: integration tests that load real atlases or start a real JVM",
    "golden: pixel and result goldens of a scripted run on a real atlas (tests/test_golden_outputs.py)",
]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
# The formatter's width (STYLE.md 1.1), which the style checker
# (tools/stylecheck) holds its trees to, line length and import order both,
# against its baseline.
line-length = 79
include = [
    "src/langslice/**/*.py",
    "tools/**/*.py",
    "tests/test_*.py",
    "tests/*_test.py",
    "tests/stylecheck/*.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

# The main run's line limit, which every file meets; the style checker's
# own ruff run uses line-length above instead.
[tool.ruff.lint.pycodestyle]
max-line-length = 100

# The main run's own ignores: the package's import order is the style
# checker's, at 79 columns against its baseline. The checker's ruff run
# empties this table (tools/stylecheck/external.py); an ignore both runs
# keep goes in [tool.ruff.lint.extend-per-file-ignores].
[tool.ruff.lint.per-file-ignores]
"src/langslice/**" = ["I001"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

# The standard aliases of STYLE.md 10.1 beyond ruff's defaults.
[tool.ruff.lint.flake8-import-conventions.extend-aliases]
"numpy.typing" = "npt"
"dask.array" = "da"
"SimpleITK" = "sitk"

# STYLE.md 4.3: `sitk` is a standard alias, not a constant imported lowercase.
[tool.ruff.lint.pep8-naming]
extend-ignore-names = ["sitk"]

# The style checker (tools/stylecheck, STYLE.md 12). The limits and banned
# words keep the defaults in tools/stylecheck/core.py; these are the settings
# that name LangSlice's own modules and types. Modules are import names.
[tool.stylecheck]
# STYLE.md 4.4: the one parameter name of each central type.
type_names = { Workspace = "workspace", "langslice.job.job.Job" = "job", JobSpec = "spec", JobLayout = "layout", Stack = "state", Section = "section", DeformableRecord = "record", ToolContext = "context", DisplayOptions = "options", ImageModel = "image_model" }
# STYLE.md 5.1 and 3.6: the modules that read and write JSON files and wire
# formats, where a TypedDict or a dict of results may stand.
json_boundary_modules = [
    "langslice.core.fits.deformable.record",
    "langslice.doors.abba.contract",
    "langslice.doors.agent.trace",
    "langslice.doors.agent_cli.envelope",
    "langslice.doors.call_log",
    "langslice.hosts.service",
    "langslice.job.history",
    "langslice.job.imports.matching",
    "langslice.job.imports.placements",
    "langslice.job.imports.readers",
    "langslice.job.index",
    "langslice.job.pictures",
    "langslice.job.plugin_store",
    "langslice.job.public_files",
    "langslice.job.recent",
    "langslice.job.state_file",
    "langslice.tools.arguments",
    "langslice.tools.descriptions.fixes",
    "tools.stylecheck.baseline",
    "tools.stylecheck.jsondata",
    "tools.stylecheck.pyright_baseline",
    "tools.stylecheck.settings",
]
# STYLE.md 8.5: the command modules, where print and sys.stdout.write belong.
cli_modules = [
    "langslice.cli",
    "langslice.doors.agent_cli.background",
    "langslice.doors.agent_cli.calls",
    "langslice.doors.agent_cli.catalog",
    "langslice.doors.agent_cli.envelope",
    "langslice.doors.agent_cli.environment",
    "langslice.doors.agent_cli.launch",
    "langslice.doors.agent_cli.main",
    "langslice.doors.commands.linear",
    "langslice.doors.commands.mcp",
    "langslice.doors.commands.parser",
    "langslice.doors.commands.transcripts",
    "langslice.tools.descriptions.fixes",
    "tools.stylecheck.__main__",
]
# STYLE.md 9.2: the one module that builds tool descriptions.
docs_renderer_module = "langslice.tools.descriptions.render"
# STYLE.md 10.3, 8.1 and 2.6: no decorators module, codes enum or
# infrastructure package exists yet. While decorators_module is empty,
# decorator-location is off and nested-definition exempts no module, so a
# decorator's wrapper is flagged wherever it is. While codes_module is
# empty, error-dict and error-code-literal check every module; while
# infra_package is empty, private-getattr checks every module.
decorators_module = ""
codes_module = ""
infra_package = ""

# STYLE.md 6.1 and 6.2, run by the style checker on public objects only
# (tools/stylecheck/numpydoc_hook.py). GL08: a docstring; PR01-PR03 and
# PR10: Parameters match the signature; RT01 and YD01: Returns and Yields;
# SS01-SS06: a one-line summary that starts with a capital, ends with a
# full stop and is not a third-person verb; GL06 and GL07: numpydoc's
# sections, in order.
[tool.numpydoc_validation]
checks = [
    "GL06", "GL07", "GL08",
    "PR01", "PR02", "PR03", "PR10",
    "RT01", "YD01",
    "SS01", "SS02", "SS03", "SS04", "SS05", "SS06",
]
# Private names: a leading underscore on a member or on the module.
exclude = ['\._', '^_[^_]']

[tool.basedpyright]
include = [
    "src/langslice",
    "tools/stylecheck",
    "tests/stylecheck",
    "tests/test_style.py",
]
extraPaths = ["src"]
pythonVersion = "3.11"
# STYLE.md 5.5. Errors that predate strict mode are listed in
# .basedpyright/baseline.json, which only shrinks.
typeCheckingMode = "strict"
reportAny = "error"
reportUnnecessaryCast = "error"
reportUnnecessaryIsInstance = "error"
reportUnnecessaryComparison = "error"
reportMissingParameterType = "error"
