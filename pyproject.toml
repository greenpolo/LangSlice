[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langslice"
version = "0.1.0"
description = "VLM-based brain slice registration using Gemini and BrainGlobe atlases"
requires-python = ">=3.10"
dependencies = [
    "google-genai",
    "google-adk",
    "openai",
    "brainglobe-atlasapi",
    "brainglobe-space",
    "numpy",
    "scipy",
    "Pillow",
    "tifffile",
    "python-dotenv",
    "itk-elastix",
]

[project.scripts]
langslice = "langslice.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "basedpyright",
]

[tool.setuptools.packages.find]
include = ["langslice*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
include = [
    "langslice/**/*.py",
    "tests/test_*.py",
    "tests/*_test.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
include = ["langslice", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
