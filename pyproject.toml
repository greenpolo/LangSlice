[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langslice"
version = "0.1.0"
description = "Agent-driven registration of histological brain sections to BrainGlobe atlases"
requires-python = ">=3.10"
dependencies = [
    "google-genai",
    "google-adk",
    "pydantic>=2",
    "litellm>=1.83.3",
    "openai",
    "brainglobe-atlasapi",
    "brainglobe-space",
    "numpy",
    "opencv-python-headless",
    "scipy",
    "Pillow",
    "tifffile",
    # Windowed and pyramid-level TIFF reads (langslice.core.native) go through
    # tifffile's zarr store; zarr 3 needs Python 3.11, so 3.10 decodes whole.
    "zarr>=3; python_version >= '3.11'",
    "python-dotenv",
    "itk-elastix",
    # The deformable engine (langslice.core.deformable): ants_syn and the
    # packaged trace_borders fit with FireANTs' SyN on torch (on the GPU when
    # torch sees one). FireANTs 1.5.1 is not on PyPI; its GitHub archive at
    # f8a9cc2 builds without the private submodule a git install trips on.
    # SimpleITK is the one dependency of FireANTs it imports.
    "torch>=2.3",
    "SimpleITK>=2.2.1",
    "fireants @ https://github.com/rohitrango/FireANTs/archive/f8a9cc259ab9113fc43bd99797000fa8fc34eb59.tar.gz",
    # N4 bias-field correction and denoising of the preprocessed channel
    # (langslice.core.image_prep). antspyx 0.6.x pins scipy<1.16 (and 0.6.2+
    # numpy<2.4), so installing it downgrades those two. It has no wheels for
    # Python 3.14 yet; there N4 and denoising are unavailable.
    "antspyx>=0.6.3,<0.7; python_version < '3.14'",
    # The job folder's cross-process write lock (langslice.job.lock).
    "filelock>=3.12",
]

[project.scripts]
langslice = "langslice.cli:main"
langslice-job = "langslice.doors.cli.jobcli:main"

[project.optional-dependencies]
# HDF5 reading (h5py). The deformable engine is a core dependency (above).
registration = [
    "h5py>=3.10",
]
abba = [
    "abba-python",
]
mcp = [
    "mcp>=1.24,<2",
]
# Claude agent models via an Anthropic API key (``anthropic-api/<model>``,
# providers/anthropic_api.py, on ADK's AnthropicLlm).
anthropic = [
    "anthropic>=1.13",
]
dev = [
    "mcp>=1.24,<2",
    "pytest",
    "pytest-xdist",
    "ruff",
    "basedpyright",
    # The layer contracts below (tests/test_import_layers.py runs them).
    "import-linter>=2.1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["langslice*"]

[tool.setuptools.package-data]
langslice = ["core/atlas/*.json", "hosts/integrations/static/*"]

# The layered core's dependency rule (docs/architecture.md): each
# layer imports only the layers below it. tests/test_import_layers.py runs
# `lint-imports`. Imports under `if TYPE_CHECKING:` are left out: a type
# named in an annotation is not a dependency at run time. No contract has
# `ignore_imports`: a violation is fixed by moving code, never listed.
[tool.importlinter]
root_package = "langslice"
exclude_type_checking_imports = true
include_external_packages = true

[[tool.importlinter.contracts]]
id = "layers"
name = "Layers: hosts > doors : agent > ops > job > core"
type = "layers"
containers = ["langslice"]
layers = ["hosts", "doors : agent", "ops", "job", "core"]

[[tool.importlinter.contracts]]
id = "no-models-below-doors"
name = "core, job and ops import no provider, agent framework or model client"
type = "forbidden"
source_modules = ["langslice.core", "langslice.job", "langslice.ops"]
forbidden_modules = ["langslice.providers", "google", "litellm", "openai", "mcp"]

[[tool.importlinter.contracts]]
id = "providers-below-doors"
name = "providers import no job, operation, door, driver or host"
type = "forbidden"
source_modules = ["langslice.providers"]
forbidden_modules = [
    "langslice.job", "langslice.ops", "langslice.doors", "langslice.agent", "langslice.hosts",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
# Tests run in parallel; an idle worker takes queued tests from a busy one.
addopts = "-ra -m 'not slow' -n auto --dist worksteal"
markers = [
    "slow: integration tests that load real atlases or start a real JVM",
]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
include = [
    "src/langslice/**/*.py",
    "tests/test_*.py",
    "tests/*_test.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
include = ["src/langslice"]
extraPaths = ["src"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
