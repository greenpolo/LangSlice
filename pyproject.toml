[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langslice"
version = "0.1.0"
description = "VLM-based brain slice registration using Gemini and BrainGlobe atlases"
requires-python = ">=3.10"
dependencies = [
    "antspyx",
    "google-genai",
    "brainglobe-atlasapi",
    "numpy",
    "scipy",
    "Pillow",
    "tifffile",
    "PySide6",
    "python-dotenv",
]

[project.scripts]
langslice = "langslice.cli:main"

[tool.setuptools.packages.find]
include = ["langslice*"]
