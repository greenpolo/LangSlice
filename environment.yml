# Run from the root of a downloaded LangSlice source archive or checkout:
# conda env create -f environment.yml
# One environment for everything: the agent, the deformable engine and the
# Claude Desktop server. On Windows pip's PyTorch runs
# on the processor only; docs/getting-started/install.md adds its CUDA build.
name: langslice
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - ".[registration,mcp]"
